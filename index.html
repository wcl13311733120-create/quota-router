<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuotaRouter - 多供应商配额感知韧性网关</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .header-left h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header-left p { color: var(--text-muted); font-size: 14px; margin-top: 4px; }
    .status-badge {
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }

    /* Grid Layout */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }
    .metric-title { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 26px; font-weight: 700; color: var(--text); }
    .metric-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* Section & Cards */
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .providers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .provider-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .provider-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .provider-name { font-size: 16px; font-weight: 600; }
    .provider-models { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .tag-active { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .tag-rate_limited { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .tag-cooldown { background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid var(--warning); }

    /* Progress bar */
    .bar-group { margin: 10px 0; }
    .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
    .bar-track { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s ease; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
      text-align: center;
      background: rgba(15, 23, 42, 0.5);
      padding: 10px;
      border-radius: 8px;
    }
    .stat-mini-val { font-size: 15px; font-weight: 600; }
    .stat-mini-lbl { font-size: 11px; color: var(--text-muted); }

    .provider-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline-danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }
    .btn-outline-danger:hover { background: rgba(239, 68, 68, 0.1); }
    .btn-primary { background: var(--accent); color: #000; font-weight: 600; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-secondary:hover { background: #475569; }

    /* Playground / Console */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 800px) { .two-col { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 8px 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 14px;
    }
    .audit-log-list {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      height: 280px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
    .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-SUCCESS { color: var(--success); }
    .log-FAILOVER_TRIGGERED { color: var(--danger); font-weight: bold; }
    .log-SIMULATED_ALERT { color: var(--warning); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>🛡️ QuotaRouter 网关控制台</h1>
        <p>多供应商配额感知智能路由与毫秒级故障转移网关 (OpenAI API 兼容)</p>
      </div>
      <div>
        <span class="status-badge" id="system-status">● 服务运行正常</span>
      </div>
    </header>

    <!-- Top Summary Metrics -->
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-title">路由策略</div>
        <div class="metric-value" id="val-strategy" style="font-size: 20px; color: var(--accent);">配额感知</div>
        <div class="metric-sub">Quota-Aware 动态算分</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">总路由请求</div>
        <div class="metric-value" id="val-total-reqs">0</div>
        <div class="metric-sub" id="val-success-rate">成功率: 100%</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">429 限流捕获/转移</div>
        <div class="metric-value" id="val-total-429" style="color: var(--warning);">0</div>
        <div class="metric-sub">全部自动故障转移降级</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">可用供应商集群</div>
        <div class="metric-value" id="val-active-providers">0 / 0</div>
        <div class="metric-sub">实时健康存活探测</div>
      </div>
    </div>

    <!-- Provider Cards -->
    <div class="section-title">
      <span>📡 上游模型供应商状态监控</span>
      <button class="btn btn-secondary" onclick="resetAllProviders()" style="margin-left: auto;">🔄 重置所有熔断</button>
    </div>
    <div class="providers-grid" id="providers-container">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Playground & Audit Logs -->
    <div class="two-col">
      <!-- Test Console -->
      <div class="panel">
        <div class="section-title">⚡ 快速路由演练 & 发起请求</div>
        <div class="form-group">
          <label>目标模型 (Model)</label>
          <select id="test-model" class="form-control">
            <option value="deepseek-chat">deepseek-chat (多供应商共有)</option>
            <option value="kimi-k3.1-pro">kimi-k3.1-pro</option>
            <option value="deepseek-reasoner">deepseek-reasoner</option>
          </select>
        </div>
        <div class="form-group">
          <label>路由策略 (Strategy)</label>
          <select id="select-strategy" class="form-control" onchange="changeStrategy(this.value)">
            <option value="quota_aware">配额感知 (Quota Aware - 推荐)</option>
            <option value="priority">优先级严格备灾 (Priority Fallback)</option>
            <option value="low_latency">最低平均延迟优先 (Low Latency)</option>
          </select>
        </div>
        <div class="form-group">
          <label>测试 Prompt</label>
          <input type="text" id="test-prompt" class="form-control" value="请总结配额感知网关的优势">
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-primary" onclick="sendTestChat()">🚀 发起网关请求 (/v1/chat/completions)</button>
        </div>
        <div style="margin-top: 14px;">
          <label style="font-size: 12px; color: var(--text-muted);">响应结果与路由轨迹：</label>
          <pre id="test-response" style="background: #0f172a; padding: 10px; border-radius: 6px; font-size: 12px; max-height: 140px; overflow-y: auto; margin-top: 6px;">点击上方按钮测试...</pre>
        </div>
      </div>

      <!-- Realtime Audit Log -->
      <div class="panel">
        <div class="section-title">📋 网关路由 & 故障转移审计日志</div>
        <div class="audit-log-list" id="audit-log-box">
          <div style="color: var(--text-muted);">暂无审计记录</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        renderDashboard(data);
      } catch (e) {
        console.error("Failed to load status:", e);
      }
    }

    function renderDashboard(data) {
      document.getElementById('val-strategy').textContent = data.server.strategy;
      document.getElementById('select-strategy').value = data.server.strategy;
      document.getElementById('val-total-reqs').textContent = data.summary.total_requests;
      document.getElementById('val-success-rate').textContent = '成功率: ' + data.summary.success_rate;
      document.getElementById('val-total-429').textContent = data.summary.total_rate_limited;
      document.getElementById('val-active-providers').textContent = `${data.server.active_providers} / ${data.server.total_providers}`;

      // Render providers
      const container = document.getElementById('providers-container');
      container.innerHTML = data.providers.map(p => {
        const rpmPercent = Math.min(100, Math.round((p.current_rpm / p.max_rpm) * 100));
        const tpmPercent = Math.min(100, Math.round((p.current_tpm / p.max_tpm) * 100));
        const statusClass = `tag-${p.status}`;
        const isCooldown = p.status === 'cooldown' || p.status === 'rate_limited';

        return `
          <div class="provider-card">
            <div class="provider-header">
              <div>
                <div class="provider-name">${p.name}</div>
                <div class="provider-models">支持模型: ${p.models.join(', ')}</div>
              </div>
              <span class="tag ${statusClass}">
                ${p.status} ${isCooldown ? `(${p.remaining_cooldown_seconds}s)` : ''}
              </span>
            </div>

            <div class="bar-group">
              <div class="bar-label">
                <span>滑动窗口 RPM (${p.current_rpm}/${p.max_rpm})</span>
                <span>${rpmPercent}%</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${rpmPercent}%; background: ${rpmPercent > 80 ? 'var(--danger)' : 'var(--accent)'};"></div>
              </div>
            </div>

            <div class="bar-group">
              <div class="bar-label">
                <span>滑动窗口 TPM (${p.current_tpm}/${p.max_tpm})</span>
                <span>${tpmPercent}%</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill" style="width: ${tpmPercent}%; background: ${tpmPercent > 80 ? 'var(--warning)' : 'var(--purple)'};"></div>
              </div>
            </div>

            <div class="stats-row">
              <div>
                <div class="stat-mini-val">${p.priority}</div>
                <div class="stat-mini-lbl">配置优先级</div>
              </div>
              <div>
                <div class="stat-mini-val" style="color: var(--accent);">${p.score}</div>
                <div class="stat-mini-lbl">配额打分</div>
              </div>
              <div>
                <div class="stat-mini-val">${p.avg_latency_ms}ms</div>
                <div class="stat-mini-lbl">平均延迟</div>
              </div>
            </div>

            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 8px;">
              状态说明: ${p.status_reason}
            </div>

            <div class="provider-actions">
              <button class="btn btn-outline-danger" onclick="simulate429('${p.id}')">
                ⚡ 模拟 429 报错 (触发Failover)
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Render audit logs
      const logBox = document.getElementById('audit-log-box');
      if (data.audit_logs && data.audit_logs.length > 0) {
        logBox.innerHTML = data.audit_logs.map(l => `
          <div class="log-item log-${l.type}">
            [${l.timestamp}] <b>${l.type}</b>: ${JSON.stringify(l)}
          </div>
        `).join('');
      }
    }

    async function simulate429(providerId) {
      await fetch('/api/providers/simulate_error', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider_id: providerId, code: 429 })
      });
      fetchStatus();
    }

    async function resetAllProviders() {
      await fetch('/api/providers/reset', { method: 'POST' });
      fetchStatus();
    }

    async function changeStrategy(newStrategy) {
      await fetch('/api/strategy', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ strategy: newStrategy })
      });
      fetchStatus();
    }

    async function sendTestChat() {
      const model = document.getElementById('test-model').value;
      const prompt = document.getElementById('test-prompt').value;
      const resBox = document.getElementById('test-response');
      resBox.textContent = "正在通过 QuotaRouter 路由请求...";

      try {
        const res = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        const data = await res.json();
        resBox.textContent = JSON.stringify(data, null, 2);
        fetchStatus();
      } catch (err) {
        resBox.textContent = "请求失败: " + err.message;
      }
    }

    // Auto refresh every 2.5 seconds
    fetchStatus();
    setInterval(fetchStatus, 2500);
  </script>
</body>
</html>
